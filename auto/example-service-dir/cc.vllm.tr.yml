# Qwen3.5-27B served via vLLM using the Triton attention backend
# Exposes OpenAI-compatible /v1/chat/completions endpoint.
#
# Pairs with example-test-dir/cc.sh (Claude Code agentic trace replay).
#
# Usage:
#   docker compose -f cc.vllm.tr.yml up -d
#   docker compose -f cc.vllm.tr.yml down
#
# Environment variables:
#   MODEL_PATH        - Path to model (default: /models/Qwen/Qwen3.5-27B)
#   SERVED_MODEL_NAME - Model name exposed via API (default: test)
#   HOST_PORT         - Port on host (default: 8976)
#   CUDA_DEVICES      - CUDA device IDs (default: 0)
#   TENSOR_PARALLEL   - Tensor parallel size (default: 1)

services:
  cc-vllm-triton:
    image: vllm/vllm-openai:nightly
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICES:-0}
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - CC=/usr/bin/gcc
      - CXX=/usr/bin/g++
      - CUDAHOSTCXX=/usr/bin/g++
      - CMAKE_CUDA_HOST_COMPILER=/usr/bin/g++
    ports:
      - "${HOST_PORT:-8976}:8976"
    command: >
      --model ${MODEL_PATH:-/models/Qwen/Qwen3.5-27B}
      --served-model-name ${SERVED_MODEL_NAME:-test}
      --host 0.0.0.0
      --port 8976
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --trust-remote-code
      --dtype bfloat16
      --attention-backend TRITON_ATTN
      --max-num-seqs 452
      --enable-prefix-caching
    volumes:
      - /workspace:/workspace
      - /modelz/models:/models
    ulimits:
      memlock: -1
      stack: 67108864
