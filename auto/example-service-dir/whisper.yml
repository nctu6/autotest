# Whisper speech-to-text model served via vLLM
# Exposes OpenAI-compatible /v1/audio/transcriptions endpoint
#
# Usage:
#   docker compose -f whisper.yml up -d
#   docker compose -f whisper.yml down
#
# Environment variables:
#   MODEL_PATH       - Path to Whisper model (default: /models/openai/whisper-large-v3)
#   HOST_PORT        - Port on host (default: 8976)
#   CUDA_DEVICES     - CUDA device IDs (default: 0)
#   TENSOR_PARALLEL  - Tensor parallel size (default: 1)

services:
  whisper-server:
    image: vllm/vllm-openai:nightly
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - CC=/usr/bin/gcc
      - CXX=/usr/bin/g++
      - CUDAHOSTCXX=/usr/bin/g++
      - CMAKE_CUDA_HOST_COMPILER=/usr/bin/g++
    ports:
      - "8976:8976"
    command: >
      --model /models/openai/whisper-large-v3
      --served-model-name test
      --host 0.0.0.0
      --port 8976
      --tensor-parallel-size 1
      --trust-remote-code
      --dtype bfloat16
    volumes:
      - /workspace:/workspace
      - /modelz/models:/models
    ulimits:
      memlock: -1
      stack: 67108864
