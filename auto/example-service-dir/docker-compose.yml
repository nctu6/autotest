# Template docker-compose for vLLM model serving (used with guidellm autotest)
# Copy and adjust for your model/GPU configuration.
#
# Usage:
#   docker compose up -d
#   docker compose down
#
# Environment variables (set in shell or .env file):
#   HUGGING_FACE_HUB_TOKEN  - HuggingFace token for gated models

services:
  Qwen3.5-9B:
    image: vllm/vllm-openai:nightly
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - CC=/usr/bin/gcc
      - CXX=/usr/bin/g++
      - CUDAHOSTCXX=/usr/bin/g++
      - CMAKE_CUDA_HOST_COMPILER=/usr/bin/g++
    ports:
      - "8976:8976"
    command: >
      --model /models/Qwen/Qwen3.5-9B
      --served-model-name test
      --host 0.0.0.0
      --port 8976
      --tensor-parallel-size 1
      --trust-remote-code
      --dtype bfloat16
    volumes:
      - /workspace:/workspace
      - /modelz/models:/models
    ulimits:
      memlock: -1
      stack: 67108864
