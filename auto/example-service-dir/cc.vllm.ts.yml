# Qwen3.5-27B served via vLLM using the TokenSpeed MLA decode attention
# backend (the `tokenspeed-mla` package, selected as VLLM_ATTENTION_BACKEND).
#
# This is a CuTe DSL MLA *decode* backend contributed to vLLM by NVIDIA. Unlike
# cc.ts.yml (which swaps the whole vLLM runner via VLLM_USE_TOKENSPEED_RUNNER),
# this config keeps the standard vLLM runner and only swaps the MLA decode
# attention kernel via the --attention-backend TOKENSPEED_MLA CLI flag.
#
# Verified against vllm-project/vllm PR #48180
# (https://github.com/vllm-project/vllm/pull/48180), which adds DCP + Eagle
# (speculative decode) support for the Tokenspeed MLA backend. Hard constraints
# from vLLM's attention_backends.md backend table:
#   * Backend id:      TOKENSPEED_MLA  (exact --attention-backend value)
#   * Model dtype:     fp16 or bf16
#   * KV cache dtype:  fp8 / fp8_e4m3 ONLY (NOT "auto") -- this backend is
#                      FP8-KV-cache only, so --kv-cache-dtype fp8 is REQUIRED.
#   * KV block size:   32 or 64
#   * GPU:             Compute Capability 10.x == NVIDIA Blackwell (B200/B100).
#                      It will not select on Hopper/Ampere.
#   * Python dep:      tokenspeed-mla (Linux only; pinned to 0.1.8 by the PR),
#                      bundled in the tokenspeed-enabled vLLM image below.
#
# NOTE: Confirm the exact image tag against LightSeek/vLLM release notes before
# pulling. Override with TS_IMAGE if it differs.
#
# Usage:
#   docker compose -f cc.vllm.ts.yml up -d
#   docker compose -f cc.vllm.ts.yml down
#
# Environment variables:
#   TS_IMAGE          - vLLM image bundling tokenspeed-mla (default: vllm/vllm-openai:v0.18.0-tokenspeed)
#   MODEL_PATH        - Path to model (default: /models/Qwen/Qwen3.5-27B)
#   SERVED_MODEL_NAME - Model name exposed via API (default: test)
#   HOST_PORT         - Port on host (default: 8976)
#   CUDA_DEVICES      - CUDA device IDs (default: 0)
#   TENSOR_PARALLEL   - Tensor parallel size (default: 1)
#   KV_CACHE_DTYPE    - KV cache dtype (default: fp8; required by TOKENSPEED_MLA)
#   KV_BLOCK_SIZE     - KV cache block size (default: 64; must be 32 or 64)

services:
  cc-vllm-tokenspeed-mla:
    image: vllm/vllm-openai:nightly
    runtime: nvidia
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICES:-0}
      - VLLM_WORKER_MULTIPROCESS_METHOD=spawn
      - CC=/usr/bin/gcc
      - CXX=/usr/bin/g++
      - CUDAHOSTCXX=/usr/bin/g++
      - CMAKE_CUDA_HOST_COMPILER=/usr/bin/g++
    ports:
      - "${HOST_PORT:-8976}:8976"
    command: >
      --model ${MODEL_PATH:-/models/Qwen/Qwen3.5-27B}
      --served-model-name ${SERVED_MODEL_NAME:-test}
      --host 0.0.0.0
      --port 8976
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --trust-remote-code
      --dtype bfloat16
      --attention-backend TOKENSPEED_MLA
      --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8}
      --block-size ${KV_BLOCK_SIZE:-64}
      --max-num-seqs 452
      --enable-prefix-caching
    volumes:
      - /workspace:/workspace
      - /modelz/models:/models
    ulimits:
      memlock: -1
      stack: 67108864
